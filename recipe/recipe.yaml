schema_version: 1

context:
  version: "0.3.1"

package:
  name: texact
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/texact/texact-${{ version }}.tar.gz
  sha256: 77564d718b5a10865361f63d78c38b41f433bb5aa841cbe7113189d882f17170

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - texact = texact:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=68
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - pillow >=10
    - colorama >=0.4

tests:
  - python:
      imports:
        - configuration
        - printer
        - reviewers
        - template_check
        - texact
        - texact_config
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - texact --help

about:
  summary: Automated article and LaTeX checks
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/Theodor-Lindberg/texact
  repository: https://github.com/Theodor-Lindberg/texact
  documentation: https://texact.org/

extra:
  recipe-maintainers:
    - Theodor-Lindberg
