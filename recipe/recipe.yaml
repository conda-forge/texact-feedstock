schema_version: 1

context:
  python_min: "3.11"
  version: "0.1.1"

package:
  name: texact
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/texact/texact-${{ version }}.tar.gz
  sha256: def62dda46b46f315f4dc2745ec6b6b2a00330df80b0994baafc9cd644c34837

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - texact = texact:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=68
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - pillow >=10
    - colorama >=0.4

tests:
  - python:
      imports:
        - configuration
        - printer
        - reviewers
        - template_check
        - texact
        - texact_config
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - texact --help

about:
  summary: Automated article and LaTeX checks
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/Theodor-Lindberg/texact
  repository: https://github.com/Theodor-Lindberg/texact
  documentation: https://theodor-lindberg.github.io/texact/

extra:
  recipe-maintainers:
    - Theodor-Lindberg
